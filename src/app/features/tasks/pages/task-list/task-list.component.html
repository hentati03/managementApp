<div class="h-full flex flex-col">
  <app-page-header
    title="Tasks"
    subtitle="Drag and drop tasks to update their status"
    [actionText]="'New Task'"
    (action)="openCreateDialog()"
  >
    <div class="flex items-center gap-3">
      <select
        [(ngModel)]="projectFilter"
        (change)="loadTasks()"
        class="input-field w-48"
      >
        <option value="">All Projects</option>
        <option *ngFor="let project of projectOptions" [value]="project.id">
          {{ project.name }}
        </option>
      </select>
      <select
        [(ngModel)]="assigneeFilter"
        (change)="loadTasks()"
        class="input-field w-48"
        *ngIf="canFilterByAssignee"
      >
        <option value="">All Assignees</option>
        <option value="me">My Tasks</option>
      </select>
    </div>
  </app-page-header>

  <div *ngIf="isLoading" class="flex justify-center py-12">
    <app-loading-spinner size="lg"></app-loading-spinner>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && allTasks.length === 0" class="flex-1 flex items-center justify-center">
    <app-empty-state
      icon="task_alt"
      title="No tasks yet"
      description="Create your first task to start tracking work and managing your projects effectively."
      actionLabel="Create Task"
      actionIcon="add"
      (action)="openCreateDialog()"
    ></app-empty-state>
  </div>

  <!-- Kanban Board -->
  <div *ngIf="!isLoading && allTasks.length > 0" class="flex-1 overflow-x-auto p-4" cdkDropListGroup>
    <div class="flex gap-4 h-full min-w-max">
      <!-- Kanban Columns -->
      <div
        *ngFor="let column of columns"
        class="kanban-column flex flex-col w-80 bg-secondary-100 rounded-lg"
      >
        <!-- Column Header -->
        <div
          class="flex items-center justify-between px-4 py-3 border-b-2"
          [style.border-color]="column.color"
        >
          <div class="flex items-center gap-2">
            <span
              class="w-3 h-3 rounded-full"
              [style.background-color]="column.color"
            ></span>
            <h3 class="font-semibold text-secondary-800">{{ column.title }}</h3>
            <span
              class="ml-2 px-2 py-0.5 text-xs font-medium bg-secondary-200 text-secondary-600 rounded-full"
            >
              {{ column.tasks.length }}
            </span>
          </div>
        </div>

        <!-- Tasks List -->
        <div
          class="flex-1 p-3 overflow-y-auto space-y-3"
          cdkDropList
          [cdkDropListData]="column.tasks"
          [id]="column.id"
          (cdkDropListDropped)="onDrop($event, column)"
        >
          <!-- Task Card -->
          <div
            *ngFor="let task of column.tasks"
            cdkDrag
            class="task-card bg-white rounded-lg p-4 shadow-sm border border-secondary-200 cursor-grab hover:shadow-md transition-shadow"
            (dblclick)="openTaskDetail(task)"
          >
            <!-- Drag Preview -->
            <div
              *cdkDragPreview
              class="task-preview bg-white rounded-lg p-4 shadow-lg border border-primary-300 w-72"
            >
              <p class="font-medium text-secondary-900">{{ task.title }}</p>
            </div>

            <!-- Drag Placeholder -->
            <div
              *cdkDragPlaceholder
              class="task-placeholder bg-secondary-200 rounded-lg h-24 border-2 border-dashed border-secondary-300"
            ></div>

            <!-- Task Content -->
            <div class="space-y-3">
              <p class="font-medium text-secondary-900 line-clamp-2">
                {{ task.title }}
              </p>

              <p
                *ngIf="task.description"
                class="text-sm text-secondary-500 line-clamp-2"
              >
                {{ task.description }}
              </p>

              <div class="flex items-center justify-between">
                <app-status-badge
                  [status]="task.priority"
                  type="priority"
                ></app-status-badge>
                <span
                  *ngIf="task.dueDate"
                  class="text-xs"
                  [ngClass]="{
                    'text-red-500': isOverdue(task),
                    'text-secondary-400': !isOverdue(task)
                  }"
                >
                  {{ task.dueDate | date : 'MMM d' }}
                </span>
              </div>

              <div
                class="flex items-center justify-between pt-2 border-t border-secondary-100"
              >
                <div class="flex items-center gap-2" *ngIf="task.assignee">
                  <app-avatar
                    [name]="
                      task.assignee.firstName + ' ' + task.assignee.lastName
                    "
                    [src]="task.assignee.avatar"
                    size="xs"
                  ></app-avatar>
                  <span class="text-xs text-secondary-500">
                    {{ task.assignee.firstName }}
                  </span>
                </div>
                <span
                  *ngIf="!task.assignee"
                  class="text-xs text-secondary-400"
                >
                  Unassigned
                </span>

                <div
                  class="flex items-center gap-1 text-xs text-secondary-400"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  {{ task.estimatedHours || 0 }}h
                </div>
              </div>

              <!-- Project Tag -->
              <div *ngIf="task.project" class="mt-2">
                <span
                  class="text-xs px-2 py-1 bg-primary-50 text-primary-700 rounded"
                >
                  {{ task.project.name }}
                </span>
              </div>
            </div>
          </div>

          <!-- Empty State -->
          <div
            *ngIf="column.tasks.length === 0"
            class="text-center py-8 text-secondary-400"
          >
            <svg class="w-10 h-10 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <p class="text-sm">No tasks</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Task Create Modal -->
  <app-task-create-modal
    *ngIf="showCreateModal"
    (onClose)="handleCreateModalClose($event)"
  ></app-task-create-modal>

  <!-- Time Entry Modal -->
  <app-time-entry-modal
    *ngIf="showTimeEntryModal"
    [task]="taskForTimeEntry?.task ?? null"
    [newStatus]="taskForTimeEntry?.newStatus ?? null"
    (onClose)="handleTimeEntryClose($event)"
  ></app-time-entry-modal>

  <!-- Task Detail Modal -->
  <app-task-detail-modal
    *ngIf="showTaskDetailModal && selectedTask"
    [task]="selectedTask"
    (onCloseEvent)="handleTaskDetailClose()"
  ></app-task-detail-modal>
</div>
